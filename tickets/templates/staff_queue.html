<table class="table table-sm align-middle">
  <thead><tr><th>Số</th><th>Dịch vụ</th><th>Mô tả</th><th>Đã chờ</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td><b>{{ r.t.code }}</b>
        {% if r.t.target_counter %}<span class="badge bg-secondary">riêng {{ r.t.target_counter.name }}</span>{% endif %}</td>
      <td>{{ r.t.service.name }}</td>
      <td>{{ r.t.note|truncatechars:40 }}</td>
      <td>{{ r.mins }} phút</td>
    </tr>
  {% empty %}
    <tr><td colspan="4" class="text-muted">Không có khách chờ.</td></tr>
  {% endfor %}
  </tbody>
</table>
